[workspace]
name = "icefields-flyover"
description = "A flyover of the Icefields Parkway, Lake Louise to the Columbia Icefield, rendered with forge3d"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
rasterio = "*"
pillow = "*"
ffmpeg = "*"
shapely = "*"

[pypi-dependencies]
forge3d = ">=1.40.1"

[tasks]
data = "python scripts/fetch_data.py"
prep = { cmd = "python scripts/prep.py", depends-on = ["data"] }
path = "python scripts/flight.py"
preview = { cmd = "python scripts/render.py --preview", depends-on = ["prep"] }
stills = { cmd = "python scripts/render.py --stills 0,12,26,38,55,75,92", depends-on = ["prep"] }
render = { cmd = "python scripts/render.py", depends-on = ["prep"] }
